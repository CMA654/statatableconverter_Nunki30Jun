<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Stata Table Converter</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; width: 620px; padding: 12px; }
  textarea { width: 100%; height: 160px; font-family: Consolas, monospace; font-size: 12px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 6px 14px; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 10px; width: 100%; font-size: 12px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f0f0f0; }
  .row { display: flex; gap: 8px; align-items: center; }
  #status { font-size: 12px; color: green; margin-left: 8px; }
</style>
</head>
<body>
  <h3>Stata → Bảng (rows/columns)</h3>
  <p style="font-size:12px;color:#555">Dán output dạng <code>sum</code> / <code>tabstat</code> của Stata vào ô bên dưới rồi nhấn Convert.</p>
  <textarea id="input" placeholder="Dán output Stata vào đây..."></textarea>
  <div class="row">
    <button id="convertBtn">Convert</button>
    <button id="copyBtn">Copy as TSV (paste vào Excel)</button>
    <span id="status"></span>
  </div>
  <div id="output"></div>
  <script src="popup.js"></script>
</body>
</html>
